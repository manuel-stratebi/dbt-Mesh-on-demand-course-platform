models:
- name: dim_product_supplies
  description: This model combines product information with their associated supply
    costs, providing a comprehensive view of each product's supply expenses. It is
    useful for analyzing the cost structure of products and making informed decisions
    about pricing and inventory management.
  config:
    contract:
      enforced: true
  columns:
  - name: product_id
    description: A unique identifier for each product.
    data_type: varchar
    constraints:
      - type: not_null
  - name: product_name
    data_type: varchar
    constraints:
      - type: not_null
  - name: product_type
    data_type: varchar
    constraints:
      - type: not_null
  - name: product_description
    data_type: varchar
  - name: product_price
    data_type: int
    constraints:
      - type: not_null
  - name: is_food_item
    data_type: boolean
    constraints:
      - type: not_null
  - name: supply_cost
    description: The total cost of supplies associated with each product.
    data_type: number 
    constraints:
      - type: not_null
  - name: is_drink_item
    data_type: boolean
    constraints:
      - type: not_null

